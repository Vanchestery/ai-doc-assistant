services:
  db:
    image: pgvector/pgvector:pg16
    container_name: aidoc-db
    environment:
      POSTGRES_DB: aidoc
      POSTGRES_USER: aidoc
      POSTGRES_PASSWORD: aidoc_dev_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aidoc -d aidoc"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
